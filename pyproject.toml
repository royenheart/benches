[project]
name = "benches"
version = "0.1.0"
description = "Small benchmarks, accelerator experiments, and algorithm tests."
requires-python = ">=3.10"
dependencies = [
    "jupyter>=1.1",
    "ipykernel>=6.29",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "black>=24",
    "flake8>=7",
]
gpgpu-accels = [
    "networkx>=3",
    "numpy>=1.26",
    "pytest>=8",
    "torch",
    "triton",
    "tilelang",
]

[tool.uv]
package = false

[tool.black]
line-length = 100
target-version = ["py310"]
exclude = '''
/(
    \.git
  | \.venv
  | \.xmake
  | build
  | backups
  | docs/superpowers
)/
'''
