[project]
name = "benches"
version = "0.1.0"
description = "Small benchmarks, accelerator experiments, and algorithm tests."
requires-python = ">=3.10"
dependencies = [
    "jupyter>=1.1",
    "ipykernel>=6.29",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "black>=24",
    "flake8>=7",
    "nbformat>=5.10",
]
gpgpu-accels = [
    "networkx>=3",
    "numpy>=1.26",
    "pytest>=8",
    "torch",
    "triton",
    "tilelang",
]
probability = [
    "numpy>=1.26",
    "scipy>=1.11",
    "sympy>=1.12",
    "matplotlib>=3.8",
    "networkx>=3",
    "plotly>=5",
    "statsmodels>=0.14",
    "pymc>=5",
    "numpyro>=0.14",
    "arviz>=0.18",
    "torch",
    "torchvision",
]

[tool.uv]
package = false

[tool.black]
line-length = 100
target-version = ["py310"]
exclude = '''
/(
    \.git
  | \.venv
  | \.xmake
  | build
  | backups
  | docs/superpowers
)/
'''
